<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>Almoxarifado Inteligente</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f6f8}iframe{display:block;width:100%;height:100%;border:0}</style>
</head>
<body>
<iframe id="almoxApp" src="./app.html" title="Almoxarifado Inteligente"></iframe>
<script>
const frame=document.getElementById('almoxApp');
frame.addEventListener('load',()=>{
  try{
    const doc=frame.contentDocument;
    if(!doc)return;
    if(doc.querySelector('script[data-almox-nf-direct]'))return;
    const s=doc.createElement('script');
    s.src='./scripts/nf-entry-intelligent.js';
    s.dataset.almoxNfDirect='1';
    doc.body.appendChild(s);
  }catch(err){console.error('Falha ao carregar módulo direto de Notas de entrada',err)}
});
</script>
</body>
</html>
