name: Codecriar Validation

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Build V2
        run: npm run build
      - name: Validate legacy-compatible prototype contracts
        run: node tests/prototype-smoke.mjs
