# Alteracao 03 executor final v8
name: Alteracao 03
on:
  push:
    paths:
      - '.github/workflows/alteracao03.yml'
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message != 'ALTERACAO 03 - leitor NF-e/DANFE'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar Alteração 03
        run: python3 scripts/aplicar_alteracao03_campos.py
      - name: Validar integridade
        run: |
          test -s index.html
          python3 -m py_compile scripts/aplicar_alteracao03_campos.py
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          required=['function extractSupplierData','siCep','siNeighborhood','siNumber','siCity','siUf','id="sCep"','id="sNeighborhood"','id="sNumber"','id="sCity"','id="sUf"']
          missing=[x for x in required if x not in s]
          print('Verificação:', 'OK' if not missing else 'FALTANDO '+repr(missing))
          if missing: raise SystemExit(1)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'ALTERACAO 03 - leitor NF-e/DANFE' || exit 0
          git push
