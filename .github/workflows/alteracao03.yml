# Alteracao 03 executor final
name: Alteracao 03
on:
  push:
    paths:
      - '.github/workflows/alteracao03.yml'
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message != 'ALTERACAO 03 - leitor NF-e/DANFE'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar Alteração 03
        run: python3 scripts/execute03.py
      - name: Validar
        run: |
          test -s index.html
          python3 -m py_compile scripts/alteracao03.py scripts/execute03.py
          grep -q 'function supplierNfeName' index.html
          grep -q 'id="siCep"' index.html
          grep -q 'id="siNeighborhood"' index.html
          grep -q 'id="siNumber"' index.html
          git diff --check
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'ALTERACAO 03 - leitor NF-e/DANFE' || exit 0
          git push
