name: Leitor Inteligente - validação

on:
  push:
    paths:
      - 'scripts/supplier-document-reader.js'
      - 'scripts/supplier-document-reader-fix.js'
      - 'scripts/supplier-document-reader-autosave.js'
      - 'scripts/supplier-document-reader-ie.js'
      - 'scripts/supplier-manual-fix.js'
      - 'scripts/supplier-reader-final-correction.js'
      - 'scripts/nf-entry-intelligent.js'
      - 'scripts/pdfjs-worker-version-fix.js'
      - 'sw.js'
      - '.github/workflows/leitor-inteligente.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verificar sintaxe JavaScript
        run: |
          node --check scripts/supplier-document-reader.js
          node --check scripts/supplier-document-reader-fix.js
          node --check scripts/supplier-document-reader-autosave.js
          node --check scripts/supplier-document-reader-ie.js
          node --check scripts/supplier-manual-fix.js
          node --check scripts/supplier-reader-final-correction.js
          node --check scripts/nf-entry-intelligent.js
          node --check scripts/pdfjs-worker-version-fix.js
          node --check sw.js
      - name: Verificar arquitetura da leitura
        run: |
          test -f scripts/nf-entry-intelligent.js
          ! test -f scripts/nf-stock-entry-reader.js
          ! test -f scripts/nf-stock-entry-reader-fix.js
          ! test -f scripts/nf-smart-entry.js
          ! test -f scripts/nf-smart-entry-final.js
          ! test -f scripts/nf-history-panel.js
          grep -q 'nf-entry-intelligent.js' sw.js
          grep -q 'invoiceDocuments' scripts/nf-entry-intelligent.js
          grep -q 'Confirmar entrada' scripts/nf-entry-intelligent.js
          grep -q 'Cadastrar novo fornecedor' scripts/nf-entry-intelligent.js
          grep -q 'application/pdf' scripts/nf-entry-intelligent.js
          grep -q 'capture="environment"' scripts/nf-entry-intelligent.js
          grep -q '\.xml' scripts/nf-entry-intelligent.js
          grep -q 'pdfjs-worker-version-fix.js' sw.js
          grep -q 'Outros' scripts/supplier-manual-fix.js
          grep -q 'window.saveSupplier' scripts/supplier-document-reader-autosave.js
          grep -q 'almoxarifado-v24' sw.js
          git diff --check
