name: Leitor Inteligente - validação

on:
  push:
    paths:
      - 'scripts/supplier-document-reader.js'
      - 'scripts/supplier-document-reader-fix.js'
      - 'scripts/supplier-document-reader-autosave.js'
      - 'scripts/supplier-document-reader-ie.js'
      - 'scripts/supplier-manual-fix.js'
      - 'scripts/supplier-reader-final-correction.js'
      - 'scripts/nf-stock-entry-reader.js'
      - 'scripts/nf-stock-entry-reader-fix.js'
      - 'scripts/pdfjs-worker-version-fix.js'
      - 'sw.js'
      - '.github/workflows/leitor-inteligente.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verificar sintaxe JavaScript
        run: |
          node --check scripts/supplier-document-reader.js
          node --check scripts/supplier-document-reader-fix.js
          node --check scripts/supplier-document-reader-autosave.js
          node --check scripts/supplier-document-reader-ie.js
          node --check scripts/supplier-manual-fix.js
          node --check scripts/supplier-reader-final-correction.js
          node --check scripts/nf-stock-entry-reader.js
          node --check scripts/nf-stock-entry-reader-fix.js
          node --check scripts/pdfjs-worker-version-fix.js
          node --check sw.js
      - name: Verificar integração
        run: |
          grep -q 'supplier-document-reader.js' sw.js
          grep -q 'supplier-reader-final-correction.js' sw.js
          grep -q 'nf-stock-entry-reader.js' sw.js
          grep -q 'nf-stock-entry-reader-fix.js' sw.js
          grep -q 'pdfjs-worker-version-fix.js' sw.js
          grep -q 'application/pdf' scripts/supplier-document-reader.js
          grep -q 'capture="environment"' scripts/supplier-document-reader.js
          grep -q 'Fornecedor' scripts/supplier-document-reader-fix.js
          grep -q 'Endereço completo + número' scripts/supplier-document-reader-fix.js
          grep -q 'saveSupplier' scripts/supplier-document-reader-fix.js
          grep -q 'DANFE' scripts/supplier-reader-final-correction.js
          grep -q 'ENDERE' scripts/supplier-reader-final-correction.js
          grep -q 'Entrada de estoque por NF' scripts/nf-stock-entry-reader.js
          grep -q 'invoiceDocuments' scripts/nf-stock-entry-reader.js
          grep -q 'entrada_nf' scripts/nf-stock-entry-reader.js
          grep -q 'Fornecedor não encontrado na lista de fornecedores' scripts/nf-stock-entry-reader.js
          grep -q 'Cadastrar fornecedor' scripts/nf-stock-entry-reader.js
          grep -q 'Confirmar entrada' scripts/nf-stock-entry-reader.js
          grep -q 'DADOS DO PRODUTO/SERVIÇO' scripts/nf-stock-entry-reader-fix.js
          grep -q 'pdfStructuredText' scripts/nf-stock-entry-reader-fix.js
          grep -q 'almoxarifado-v18' sw.js
          git diff --check
