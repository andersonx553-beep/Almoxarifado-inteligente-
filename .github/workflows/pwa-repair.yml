name: PWA repair
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, 'PWA - restore official V2.4 index') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact V2.4 index and apply only PWA hooks
        shell: bash
        run: |
          set -euo pipefail
          git show 73a7ce145f7ca25864322448912330471361bc78:index.html > index.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<meta name="viewport" content="width=device-width, initial-scale=1.0">\n<title>'
          new='<meta name="viewport" content="width=device-width, initial-scale=1.0">\n<link rel="manifest" href="./manifest.json">\n<meta name="theme-color" content="#111827">\n<title>'
          assert s.count(old)==1
          s=s.replace(old,new,1)
          old2='updateAll();renderCount();\n'
          new2="updateAll();renderCount();\nif ('serviceWorker' in navigator) {\n  window.addEventListener('load', () => {\n    navigator.serviceWorker.register('./sw.js', {scope:'./'})\n      .catch(err => console.error('Falha ao registrar Service Worker', err));\n  });\n}\n"
          assert s.count(old2)==1
          s=s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')
          PY
          node --check <(sed -n '/<script>/,/<\/script>/p' index.html | sed '1d;$d')
          rm .github/workflows/pwa-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/pwa-repair.yml
          git commit -m 'PWA - restore official V2.4 index'
          git push
